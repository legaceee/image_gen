<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="cyberSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="60%" stop-color="#180c2e"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="neonGlowPink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#ff7700"/>
    </linearGradient>
    <linearGradient id="neonGlowCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#7000ff"/>
    </linearGradient>
  </defs>

  <!-- Dark Cyber Sky -->
  <rect width="800" height="800" fill="url(#cyberSky)"/>

  <!-- Futuristic Skyscrapers -->
  <rect x="60" y="180" width="120" height="500" fill="#090d16"/>
  <rect x="210" y="100" width="160" height="580" fill="#0f172a"/>
  <rect x="400" y="140" width="140" height="540" fill="#090d16"/>
  <rect x="570" y="220" width="170" height="460" fill="#111827"/>

  <!-- Skyscraper Windows / Holograms -->
  <g fill="#00f0ff" opacity="0.6">
    <rect x="230" y="140" width="30" height="8"/>
    <rect x="280" y="140" width="30" height="8"/>
    <rect x="230" y="180" width="30" height="8"/>
    <rect x="280" y="180" width="30" height="8"/>
    <rect x="430" y="200" width="80" height="40" fill="url(#neonGlowPink)" opacity="0.8"/>
  </g>

  <!-- Wet Street Surface with Neon Reflections -->
  <polygon points="0,620 800,620 800,800 0,800" fill="#070a13"/>
  <polygon points="200,620 600,620 750,800 50,800" fill="#0d1527"/>

  <!-- Wet Road Neon Streaks -->
  <line x1="280" y1="620" x2="180" y2="800" stroke="#00f0ff" stroke-width="4" opacity="0.7"/>
  <line x1="420" y1="620" x2="400" y2="800" stroke="#ff0055" stroke-width="6" opacity="0.8"/>
  <line x1="520" y1="620" x2="620" y2="800" stroke="#00f0ff" stroke-width="4" opacity="0.7"/>

  <!-- Floating Cybercraft / Vehicle -->
  <g transform="translate(250, 480)">
    <polygon points="50,40 250,40 280,70 20,70" fill="#1e1b4b"/>
    <polygon points="70,10 230,10 250,40 50,40" fill="#0284c7" opacity="0.7"/>
    <!-- Thruster glow -->
    <ellipse cx="60" cy="72" rx="20" ry="6" fill="#00f0ff"/>
    <ellipse cx="240" cy="72" rx="20" ry="6" fill="#00f0ff"/>
    <ellipse cx="150" cy="74" rx="40" ry="8" fill="#ff0055"/>
  </g>

  <!-- Forensic Latent Prompt Watermark -->
  <g font-family="monospace" font-size="12" fill="#f43f5e" opacity="0.85">
    <text x="30" y="50">PROMPT HASH: 7b84cf29e011b9</text>
    <text x="30" y="70">LATENT UPSCALER: Latent Blending 4x [AI PROBABILITY: 96.1%]</text>
    <text x="540" y="50">MODEL: MIDJOURNEY v6</text>
    <text x="540" y="70">ATTRIBUTION: SYNTHETIC</text>
  </g>
</svg>
